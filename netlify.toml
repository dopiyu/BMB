# Netlify builds from GitHub: every merge to main goes live, every pull request gets a preview link.
[build]
  publish = "site"
  # Stamp the service worker with this deploy's commit so installed phones fetch the new version.
  command = "sed -i \"s/bmb-dev/bmb-${COMMIT_REF:-local}/\" site/sw.js"

[context.deploy-preview]
  command = "sed -i \"s/bmb-dev/bmb-preview-${COMMIT_REF:-local}/\" site/sw.js"

# The Firebase web apiKey is meant to be public (it ships in every Firebase web app;
# Firestore rules protect the data). Tell Netlify's secret scanner it's expected.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "site/js/firebase-config.js"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBJEGqMMw9IMAq9OySS7kDTvXK91dErFQ8"
